name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate
        working-directory: apps/api

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes (API e interface)
        run: npm test

      - name: Build do front-end
        run: npm run build -w @estoquein/web
